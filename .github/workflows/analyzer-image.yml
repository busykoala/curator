name: Analyzer container
on:
  push:
    branches: [main]
    paths: ["analyzer/**", ".github/workflows/analyzer-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/busykoala/curator-analyzer
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.description=Curator audio analyzer (Essentia models: CC BY-NC-SA 4.0, see MODELS.md)
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: analyzer
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=analyzer
          cache-to: type=gha,mode=max,scope=analyzer
          provenance: mode=max
          sbom: true
      - name: Smoke test
        run: |
          docker run --rm --entrypoint python ghcr.io/busykoala/curator-analyzer@${{ steps.build.outputs.digest }} -c "import sys;sys.argv=['x'];import importlib.util as u;s=u.spec_from_file_location('app','/app/app.py');m=u.module_from_spec(s);s.loader.exec_module(m);print('heads',len(m.HEADS),'genre classes',len(m.METADATA['genre']['classes']))"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/busykoala/curator-analyzer
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
